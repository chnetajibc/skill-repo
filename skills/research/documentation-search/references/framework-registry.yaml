# Central framework registry (machine-readable)
# Purpose: let the agent discover AUTHORITATIVE sources at runtime.
# This file contains NO documentation content — only pointers.
# Convention: every entry names official docs first; community sources never appear here.
# Usage: documentation-search resolves technology -> entry -> official_docs for the INSTALLED version.
# `version_files` lists repo files (in priority order) that pin the version the project uses.
# Rule: installed version != latest version. Never substitute latest docs for pinned-version docs.

python:
  ecosystem: language
  official_docs: https://docs.python.org/
  typing: https://typing.python.org/
  packaging: https://packaging.python.org/
  package_registry: https://pypi.org/
  version_files: [pyproject.toml, uv.lock, requirements.txt, poetry.lock, Pipfile.lock, .python-version]
